plugins {
    id "fabric-loom" version "1.8.+"
    id "maven-publish"
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

base.archivesName = archives_base_name
group = project.maven_group

String buildNumber = System.getenv("GITHUB_RUN_NUMBER")
version = "$mod_version+$minecraft_version" + (buildNumber != null ? "-build.$buildNumber" : "")

repositories {
    maven { url = "https://maven.parchmentmc.org" }

    maven { url = "https://mvn.devos.one/releases" }
    maven { url = "https://mvn.devos.one/snapshots" }
    maven { url = "https://modmaven.dev/" }
    maven { url = "https://maven.jamieswhiteshirt.com/libs-release" }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" }

    maven {
        url = "https://jitpack.io/"
        content { includeGroupAndSubgroups("com.github") }
    }

    maven { url = "https://maven.shedaniel.me" }
    maven { url = "https://maven.blamejared.com" }
    maven { url = "https://maven.terraformersmc.com/releases" }
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.engine-room.dev/releases" }

    mavenCentral()
}

configurations {
    shadow
    implementation.extendsFrom(shadow)
}

configurations.configureEach {
    resolutionStrategy {
        force("net.fabricmc:fabric-loader:$fabric_loader_version")
    }
}

dependencies {
    // Minecraft + Fabric
    minecraft("com.mojang:minecraft:$minecraft_version")
    mappings(loom.layered {
        it.officialMojangMappings { nameSyntheticMembers = false }
        it.parchment("org.parchmentmc.data:parchment-$minecraft_version:$parchment_version@zip")
    })
    modImplementation("net.fabricmc:fabric-loader:$fabric_loader_version")
    modImplementation("net.fabricmc.fabric-api:fabric-api:$fabric_api_version")

    // Create
    modImplementation("com.simibubi.create:create-fabric:${create_fabric_version}")

    // Dev Tools
    modLocalRuntime("com.terraformersmc:modmenu:$modmenu_version")

    // Recipe Viewer
    switch (recipe_viewer.toLowerCase(Locale.ROOT)) {
        case "jei": modLocalRuntime("mezz.jei:jei-$minecraft_version-fabric:$jei_version"); break
        case "rei": modLocalRuntime("me.shedaniel:RoughlyEnoughItems-fabric:$rei_version"); break
        case "emi": modLocalRuntime("dev.emi:emi-fabric:$emi_version"); break
        case "disabled": break
        default: println("Unknown recipe viewer specified: $recipe_viewer")
    }

    // =========================
    // SHADED LIBRARIES
    // =========================

    // Undertow + Dependencies
    shadow("io.undertow:undertow-core:2.2.24.Final")
    shadow("org.jboss.logging:jboss-logging:3.4.3.Final")
    shadow("org.jboss.threads:jboss-threads:3.5.0.Final")
    shadow("org.jboss.xnio:xnio-api:3.8.16.Final")
    shadow("org.jboss.xnio:xnio-nio:3.8.16.Final")
    shadow("org.wildfly.common:wildfly-common:1.5.4.Final")
    shadow("org.wildfly.client:wildfly-client-config:1.0.1.Final")

    // Jackson
    shadow("com.fasterxml.jackson.core:jackson-databind:2.15.2")
    shadow("com.fasterxml.jackson.core:jackson-core:2.15.2")
    shadow("com.fasterxml.jackson.core:jackson-annotations:2.15.2")

    shadow("org.tomlj:tomlj:1.1.1")
}

processResources {
    Map<String, Object> properties = [
            "version": version,
            "fabric_loader_version": fabric_loader_version,
            "fabric_api_version": fabric_api_version,
            "create_version": create_fabric_version,
            "minecraft_version": minecraft_version
    ]

    inputs.properties(properties)

    filesMatching("fabric.mod.json") {
        expand properties
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

shadowJar {
    configurations = [project.configurations.shadow]
    archiveClassifier.set("dev-shadow")

    relocate "io.undertow", "eu.cronmoth.createtrainwebapi.shadow.io.undertow"
    relocate "org.jboss", "eu.cronmoth.createtrainwebapi.shadow.org.jboss"
    relocate "com.fasterxml.jackson", "eu.cronmoth.createtrainwebapi.shadow.com.fasterxml.jackson"
    relocate "org.tomlj", "eu.cronmoth.createtrainwebapi.shadow.org.tomlj"
//    relocate "org.wildfly", "eu.cronmoth.createtrainwebapi.shadow.org.wildfly"
//    relocate "org.xnio", "eu.cronmoth.createtrainwebapi.shadow.org.xnio"
//    relocate "org.antlr", "eu.cronmoth.createtrainwebapi.shadow.org.antlr"
//    relocate "org.checkerframework", "eu.cronmoth.createtrainwebapi.shadow.org.checkerframework"
}

remapJar {
    dependsOn shadowJar
    mustRunAfter(shadowJar)
    inputFile.set(shadowJar.archiveFile)
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

